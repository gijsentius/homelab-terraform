# Template for secrets.enc.yaml. Don't fill this file in — create the encrypted
# file directly, sops opens your editor and encrypts on save:
#
#   sops secrets.enc.yaml
#
# Keys starting with TF_VAR_ are picked up by OpenTofu as the matching variable
# when run through scripts/tofu.sh. Don't also set these variables in
# <site>.tfvars: tfvars takes precedence over TF_VAR_ environment variables.
#
# Keys that differ per site (e.g. a second Proxmox host's token) go in an
# optional secrets.<site>.enc.yaml, which overrides this file for that site:
#
#   sops secrets.site-b.enc.yaml

TF_VAR_proxmox_api_token: "root@pam!terraform=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# Leave both empty to skip creating the tailscale-operator operator-oauth Secret
TF_VAR_tailscale_oauth_client_id: ""
TF_VAR_tailscale_oauth_client_secret: ""

# Not a Terraform input — written into OpenBao by hand for cert-manager
# (README Step 6). Kept here so it's available on any machine with the age key.
CLOUDFLARE_API_TOKEN: ""
