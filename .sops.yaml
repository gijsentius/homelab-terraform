# sops encrypts secrets.enc.yaml to these age recipients. Only public keys live
# here — add a line per machine/person that should be able to decrypt, then run
# `sops updatekeys` on each secrets*.enc.yaml file to re-encrypt for the new list.
creation_rules:
  # secrets.enc.yaml (shared) and secrets.<site>.enc.yaml (per-site overrides)
  - path_regex: secrets(\.[a-z0-9-]+)?\.enc\.yaml$
    age: >-
      age12e08xk97g4mjlj9nsn20xvdneqy5svtwcu52tflxlffqftznlu7s5zn7at
